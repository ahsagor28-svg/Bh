name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          for f in *.zip; do unzip -o "$f" -d project; done
          SUBDIR=$(find project -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "PROJ_DIR=$SUBDIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoctisFocus-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
          
